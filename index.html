<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DARKSIDE — Futuristic Space Shooter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- HUD / overlay container -->
  <div id="hud">
    <div class="hud-row">
      <div id="score" class="hud-item">SCORE: 000000</div>
      <div id="shield" class="hud-item">SHIELD: 100%</div>
    </div>

    <div id="energy" class="hud-bottom">ENERGY: 100%</div>

    <div id="radar-ui">
      <canvas id="radar" width="200" height="200"></canvas>
    </div>
  </div>

  <!-- Center overlay (title / game over / replay) -->
  <div id="overlay">
    <div id="title">DARKSIDE</div>
    <div id="subtitle">A lone ship fights through the dark side...</div>

    <!-- Game over content (shows when lost) -->
    <div id="gameover" aria-hidden="true">
      <div id="gameover-score" class="hud-item">SCORE: 000000</div>
      <button id="replay-btn" class="btn btn-glow">REPLAY</button>
    </div>
  </div>

  <!-- Persistent control buttons (START + BOOST) - separate from HUD -->
  <div id="controls-bottom" role="toolbar" aria-label="Game controls">
    <button id="start-btn" class="btn btn-glow">START</button>
    <button id="boost-btn" class="btn btn-glow">BOOST</button>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
